name: Read refactor build failure
on:
  push:
    branches: [refactor/engine-and-client]
    paths: [.github/workflows/diagnose-once.yml]
permissions: {actions: read, pull-requests: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 45994201835 --repo "$GITHUB_REPOSITORY" --log-failed | grep -E 'Error|error|Traceback|not found|failed|ENOENT|npm ERR|Assertion' | tail -12 > /tmp/diag
          if [ -s /tmp/diag ]; then gh pr comment 4 --repo "$GITHUB_REPOSITORY" --body-file /tmp/diag; fi
