name: Capture historical save once
on:
  push:
    branches: [refactor/engine-and-client]
    paths: [.github/workflows/capture-fixture.yml]
permissions: {contents: write}
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node tests/turns.cjs
          mkdir -p tests/fixtures
          node - <<'JS'
          const G=require('./game.js'),g=G.fresh(17); for(const a of ['travel','west','west','buy0'])if(!G.act(g,a))throw Error(a);g.hero.cd=2;require('node:fs').writeFileSync('tests/fixtures/v2-market.json',JSON.stringify(g)+'\n');
          JS
          git rm .github/workflows/capture-fixture.yml
          git add tests/fixtures/v2-market.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Freeze a playable v2 market save from the released rules'
          git push origin HEAD:refactor/engine-and-client
