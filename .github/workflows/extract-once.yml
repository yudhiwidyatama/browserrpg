name: Extract released geometry and validate
on:
  push:
    branches: [refactor/engine-and-client]
    paths: [.github/workflows/extract-once.yml]
permissions: {contents: write}
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          python3 - <<'PY'
          import subprocess,re
          from pathlib import Path
          old='1f20d26edcddce8bdbc76e270e1111a35199eee5'
          def original(file): return subprocess.check_output(['git','show',old+':'+file],text=True)
          source=original('view.js'); start=source.index('const palettes='); end=source.index('const actions='); r=source[start:end]
          a=r.index('let u,v,z,ox,oy;'); b=r.index('function poly(',a); r=r[:a]+'''let camera,game,tileHalfWidth,tileHalfHeight;
          const project=(x,y,height=0)=>camera.project(x,y,height);
          '''+r[b:]
          a=r.index('u=Math.min(w/'); b=r.index('for(let sum=',a)
          r=r[:a]+'''camera=createCamera(w,h,surf?surface.lift:game.hero,surf);
          tileHalfWidth=camera.halfWidth;tileHalfHeight=camera.halfHeight;
          '''+r[b:]
          r=r.replace('function draw(){','function draw(state){game=state;').replace("shop===G.shops[0]?'#3e999d':'#c36d59'",'shop.color').replace('x===10&&y===10','x===surface.lift.x&&y===surface.lift.y').replace('x<7||x>13||y<8||y>12','x<surface.bounds.minX||x>surface.bounds.maxX||y<surface.bounds.minY||y>surface.bounds.maxY')
          for oldName,newName in {'s':'game','u':'tileHalfWidth','v':'tileHalfHeight','proj':'project','poly':'fillPolygon','actor':'drawActor','deco':'drawScenery','surf':'onSurface','pal':'palette','c':'context'}.items():
              r=re.sub(r'\b'+oldName+r'\b',newName,r)
          r=r.replace('G.k(','G.tileIndex(')
          Path('src/client/renderer.cjs').write_text("const G=require('../grid.cjs');\nconst {surface,shops}=require('../content.cjs');\nconst {createCamera}=require('./camera.cjs');\nfunction createRenderer(canvas){const context=canvas.getContext('2d');\n"+r.replace('G.shops','shops')+"\nreturn {draw,get camera(){return camera;}};}\nmodule.exports={createRenderer};\n")
          p=Path('index.html'); html=original('index.html'); html=html.replace('<script src="game.js"></script><script src="view.js"></script>','<script src="dist/lantern.js"></script>').replace('<button data-act="exit">Use exit [E]</button>','<button data-act="use">Interact [E]</button><button data-act="travel">Visit surface [R]</button><span id="shop-stock"></span>').replace('Gold ring: exit · green vial: healing · cyan: you · red: foe.','Map: cyan = you · blue = spring · copper = chest · yellow = seal · gold ring = exit. Walk onto loot to pick it up.');assert 'shop-stock' in html and 'dist/lantern.js' in html;p.write_text(html)
          for name in ['rules','economy','turns']:
              p=Path('tests/'+name+'.cjs');t=p.read_text();t=t.replace('G.flood(', 'G.walkingDistancesFrom(').replace('G.k(', 'G.tileIndex(').replace('G.dist(', 'G.manhattanDistance(').replace('.cd','.flareCooldown');t=t.replace('buy0','buy:hookblade').replace('buy1','buy:tide-sabre');
              if name=='economy':
                  pos=t.index('Crown Forge');t=t[:pos]+t[pos:].replace('buy:tide-sabre','buy:dawn-pike');
              p.write_text(t)
          p=Path('.github/workflows/game.yml');t=p.read_text().replace('      - run: node tests/rules.cjs && node package.cjs','      - uses: actions/setup-node@v4\n        with: {node-version: 22}\n      - run: npm ci && npm run format:check && npm test && npm run build');p.write_text(t)
          p=Path('README.md');t=p.read_text().replace('or open `index.html` from the extracted source tree','or run `npm ci && npm run build` in the extracted source tree and open `index.html`');t=t[:t.index('**Verification:**')]+'''**Development:** See [CONTRIBUTING.md](CONTRIBUTING.md) for module boundaries, formatting, build instructions, save compatibility and test commands. Players only need the release HTML.\n''';p.write_text(t)
          PY
          npm install --package-lock-only
          npm ci
          npm run format
          git rm .github/workflows/extract-once.yml
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Extract renderer, wire browser modules, lock build tools and format source'
          git push origin HEAD:refactor/engine-and-client
          npm test && npm run build
