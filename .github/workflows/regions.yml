name: Regional expedition
on: [push, pull_request]
permissions: {contents: read}
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci && node tests/atlas.cjs && npm run build
      - name: Visit all regions in the standalone build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8768 --bind 127.0.0.1 > "$RUNNER_TEMP/atlas-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8768/tests/atlas.html -o /dev/null && break; sleep .2; done
          google-chrome --headless --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8768/tests/atlas.html > "$RUNNER_TEMP/atlas-result.html"
          grep '<p id="status">ATLAS_OK</p>' "$RUNNER_TEMP/atlas-result.html"
