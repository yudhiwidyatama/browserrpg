name: Format synth sources once
on:
  push:
    branches: [feature/synth-audio]
    paths: [.github/workflows/format-synth-once.yml]
permissions: {contents: write}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm ci && npm run format
          printf '\n**Sound:** Toggle Music and Sound effects independently in the header. See [AUDIO.md](AUDIO.md) for the synth score and controls.\n' >> README.md
          git add view.js src/client/audio tests/audio-browser.cjs tests/audio.html README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format synth modules and link the player audio guide'
          git push origin HEAD:feature/synth-audio
