name: Format existing sources
on:
  push:
    branches: [refactor/format]
    paths: [.github/workflows/format-once.yml]
permissions: {contents: write}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npx --yes prettier@3.6.2 --write game.js view.js package.cjs tests/*.cjs tests/browser.html index.html
          git rm .github/workflows/format-once.yml
          git add game.js view.js package.cjs tests index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Format existing game, view, HTML and tests without changing rules'
          git push origin HEAD:refactor/format
