<!doctype html><title>Browser smoke test</title><p id="status">PENDING</p><iframe id="app" width="900" height="800"></iframe><script>
const frame=document.getElementById('app');frame.onload=()=>{try{const w=frame.contentWindow,d=w.document;const canvas=d.querySelector('canvas'),ctx=canvas.getContext('2d');const colors=new Set(),pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;for(let i=0;i<pixels.length;i+=160)colors.add(`${pixels[i]},${pixels[i+1]},${pixels[i+2]}`);if(colors.size<15)throw Error('Missing dungeon geometry');d.querySelector('[data-act=wait]').click();if(!d.querySelector('#floor').textContent.endsWith('Turn 1'))throw Error('Turn button failed');w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'.'}));if(!d.querySelector('#floor').textContent.endsWith('Turn 2'))throw Error('Keyboard failed');const saved=JSON.parse(w.localStorage.getItem('lantern-below-v1'));if(saved.turn!==2||saved.floor!==1)throw Error('Save failed');document.getElementById('status').textContent='BROWSER_OK';}catch(e){document.getElementById('status').textContent=String(e);}};frame.src='../Lantern-Below.html';</script>
